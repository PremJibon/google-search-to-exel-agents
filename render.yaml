services:
  - type: web
    name: leadfinder-free
    env: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: APP_USER_AGENT
        value: LeadFinderFree/1.0 (contact: github-lead-finder)
